<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom </title>
    <Style>
        :root {
    --bg: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    --card: rgba(255, 255, 255, 0.85);
    --text: #2d3748;
    --subtext: #718096;
    --primary: #6366f1;
    --hover: #4f46e5;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    --border: rgba(255, 255, 255, 0.5);
}

body.dark-mode-active {
    --bg: linear-gradient(135deg, #0f172a, #1e293b);
    --card: rgba(30, 41, 59, 0.85);
    --text: #f8fafc;
    --subtext: #94a3b8;
    --primary: #818cf8;
    --hover: #6366f1;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    --border: rgba(255, 255, 255, 0.08);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    transition: background 0.3s, color 0.3s, border 0.3s;
}

body {
    min-height: 100vh;
    padding: 35px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text);
    background:
        radial-gradient(circle at 12% 15%, #818cf847, transparent 28%),
        radial-gradient(circle at 88% 78%, #a855f738, transparent 30%),
        var(--bg);
    background-attachment: fixed;
    position: relative;
    isolation: isolate;
    overflow-x: hidden;
}

body::before,
body::after {
    content: "";
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    opacity: 0.4;
    filter: blur(3px);
    z-index: -1;
    pointer-events: none;
    animation: glow 9s ease-in-out infinite alternate;
}

body::before {
    top: -90px;
    right: -70px;
}

body::after {
    bottom: -120px;
    left: -80px;
    width: 340px;
    height: 340px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    animation-delay: -4s;
}

@keyframes glow {
    to {
        transform: translate(-24px, 24px) scale(1.08);
    }
}

.container {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin: auto;
    position: relative;
    z-index: 1;
}

.page-heading {
    text-align: center;
    animation: fadeIn 0.7s ease;
}

.eyebrow {
    display: inline-block;
    padding: 7px 13px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 30px;
    background: var(--card);
    color: var(--primary);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
}

.page-heading h1 {
    font-size: clamp(30px, 5vw, 46px);
    margin-bottom: 10px;
    letter-spacing: -1px;
}

.page-heading p,
.footer-note {
    color: var(--subtext);
}

.page-heading p {
    font-size: 15px;
}

.top-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}

.card {
    width: 100%;
    padding: 30px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.6s ease;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, #6366f1, #a855f7);
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 42px rgba(30, 41, 59, 0.14);
}

.card h2 {
    margin-bottom: 20px;
    font-size: 1.25rem;
    font-weight: 600;
}

button {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible {
    outline: 3px solid #818cf888;
    outline-offset: 3px;
}

.btn-change {
    padding: 13px 30px;
    font-size: 15px;
    font-weight: 600;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 15px #6366f14d;
}

.btn-change:hover,
.btn-counter:hover {
    background: var(--hover);
    transform: translateY(-2px);
}

.mode-box {
    display: flex;
    align-items: center;
    gap: 15px;
}

.mode-box span {
    font-size: 20px;
}

.btn-dark {
    width: 75px;
    height: 40px;
    padding: 4px;
    border: none;
    border-radius: 30px;
    background: #cbd5e1;
    position: relative;
}

body.dark-mode-active .btn-dark {
    background: #4f46e5;
}

.btn-dark::before {
    content: "";
    width: 32px;
    height: 32px;
    position: absolute;
    top: 4px;
    left: 4px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 2px 5px #0003;
    transition: transform 0.3s;
}

body.dark-mode-active .btn-dark::before {
    transform: translateX(35px);
}

.password-container {
    display: flex;
    gap: 12px;
    width: 100%;
}

.password-container input {
    flex: 1;
    min-width: 0;
    padding: 14px 18px;
    border: 2px solid transparent;
    border-radius: 12px;
    outline: none;
    background: #0000000a;
    color: var(--text);
    font-size: 16px;
}

body.dark-mode-active .password-container input {
    background: #ffffff0d;
}

.password-container input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px #6366f126;
}

.btn-toggle {
    padding: 0 20px;
    border: none;
    border-radius: 12px;
    background: #0000000d;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
}

body.dark-mode-active .btn-toggle {
    background: #ffffff1a;
}

.btn-toggle:hover {
    background: #0000001a;
}

.counter-box {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
}

.btn-counter {
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 28px;
    font-weight: bold;
    box-shadow: 0 4px 15px #6366f14d;
}

.btn-counter:active {
    transform: scale(0.95);
}

#number {
    min-width: 120px;
    font-size: 64px;
    font-weight: 800;
}

.btn-reset {
    margin-top: 18px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--subtext);
    font-weight: 600;
}

.btn-reset:hover {
    color: var(--primary);
}

.footer-note {
    text-align: center;
    font-size: 12px;
}

.pulse {
    animation: pulse 0.3s ease;
}

@keyframes pulse {
    50% {
        transform: scale(1.2);
        color: var(--primary);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    body {
        padding: 20px 13px;
    }

    .top-row {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 24px 18px;
    }

    .password-container {
        flex-direction: column;
    }

    .btn-toggle {
        padding: 12px;
    }

    .counter-box {
        gap: 16px;
    }

    #number {
        min-width: 80px;
        font-size: 52px;
    }

    .btn-counter {
        width: 52px;
        height: 52px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
    </Style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="page-heading">
            <span class="eyebrow">Interactive Experience</span>3
            <span class="eyebrow">Interactive Experience</span>4

        </header>

        <div class="top-row">
            <div class="card">
                <h2 id="Sarlavha">O'zgartirish!</h2>
                <button class="btn-change" id="btnChange">Bosing</button>
            </div>

            <div class="card">
                <h2>Tungi Rejim</h2>
                <div class="mode-box">
                    <span></span>
                    <button class="btn-dark" id="darkModeBtn"
                        aria-label="Tungi rejimni o'zgartirish"></button>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Xavfsizlik</h2>
            <div class="password-container">
                <input type="password" id="passwordInput"
                    placeholder="Maxfiy parolni kiriting...">
                <button class="btn-toggle" id="toggleButton">Ko'rsatish</button>
            </div>
        </div>

        <div class="card">
            <h2>Hisoblagich</h2>
            <div class="counter-box">
                <button class="btn-counter" id="minus">−</button>
                <span id="number" aria-live="polite">0</span>
                <button class="btn-counter" id="plus">+</button>
            </div>
            <button class="btn-reset" id="resetCounter">↻ Nolga qaytarish</button>
        </div>

       
    </div>

    <script src="script.js"></script>
</body>
</html>
